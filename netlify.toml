[build]
publish = "public"

# The go command requests https://go.oicana.com/<import path>?go-get=1 for the module and for each of its
# packages, and reads the go-import meta tag from the response. Every path under /oicana gets the same page.
[[redirects]]
from = "/oicana"
to = "/_go/oicana.html"
status = 200
force = true

[[redirects]]
from = "/oicana/*"
to = "/_go/oicana.html"
status = 200
force = true

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
